title: CAI Field Manual
baseURL: https://rh-aiservices-bu.github.io/CAI-Field-Manual-prototype/
defaultContentLanguage: en
disableLanguages: [zh, fr]
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: CAI Field Manual
    params:
      description: Documentation, updates, and guides for your project.
  # Keep disabled languages declared so Hugo recognizes .zh.md and .fr.md as
  # translations instead of treating them as duplicate English pages.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: CAI Field Manual
    hasCJKLanguage: true
  fr:
    label: Français
    locale: fr-FR
    weight: 3
    title: CAI Field Manual

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

services:
  googleAnalytics:
    # Placeholder GA4 measurement ID — swap in the real ID before real traffic.
    ID: G-XXXXXXXXXX

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  # Red Hat CAI Team lockup (fedora + divider + wordmark); sized for the
  # 4.3:1 aspect in assets/scss/_styles_project.scss. Ink follows the site
  # theme toggle via the SVG's own prefers-color-scheme query.
  logo: icons/logo-rh-cai.svg
  github_repo: rh-aiservices-bu/CAI-Field-Manual-prototype
  github_branch: main
  offline_search: true
  copyright:
    authors: Project contributors
    from_year: 2026
  footer_center_info: ''
  ui:
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    docs_section: field-guides
    share: [claude, chatgpt, linkedin, email, copy]
    page_context_menu:
      assistant_links: true
  # Display options: the header selector persists these in localStorage and
  # filters content blocks tagged with the variant shortcode. An axis option
  # with id `both` never hides anything; untagged blocks always render.
  variants:
    mode:
      label: Ops mode
      default: both
      options:
        - { id: both, label: Show both }
        - { id: gitops, label: GitOps }
        - { id: clicops, label: ClicOps }
    version:
      label: Guide version
      default: '3.6'
      options:
        - { id: '3.6', label: '3.6' }
        - { id: '3.4', label: '3.4' }
module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.168.0
